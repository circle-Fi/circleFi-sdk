name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # The factory is live; a daily read catches it going away.
    - cron: '17 6 * * *'
jobs:
  unit:
    # Offline: unit tests and the type declarations. Runs on every push and PR.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:types

  live-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run test:live
