name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # The factory is live; a daily read catches it going away.
    - cron: '17 6 * * *'
jobs:
  live-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run test:live
